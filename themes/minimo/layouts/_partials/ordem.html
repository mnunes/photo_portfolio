<div class="ordem" role="group" aria-label="Ordenar álbuns" hidden>
  <span>Ordenar por</span>
  <button type="button" data-valor="local" aria-pressed="true">Local</button>
  <button type="button" data-valor="data" aria-pressed="false">Data</button>
</div>
<script>
(() => {
  const grupo = document.currentScript.previousElementSibling;
  grupo.hidden = false;
  const aplicar = (v) => {
    document.querySelectorAll('[data-ordem]').forEach(el => el.dataset.ordem = v);
    grupo.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.valor === v));
    try { localStorage.setItem('ordem-arquivo', v); } catch (e) {}
  };
  grupo.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) aplicar(b.dataset.valor); });
  let salvo = null;
  try { salvo = localStorage.getItem('ordem-arquivo'); } catch (e) {}
  if (salvo === 'data') addEventListener('DOMContentLoaded', () => aplicar('data'));
})();
</script>
