{{ define "main" }}
<header class="cabecalho">
  <p class="rotulo">Paisagem e rua</p>
  <h1>{{ .Title }}</h1>
  <div class="texto">{{ .Content }}</div>
</header>
{{ partial "ordem.html" }}
<div class="arquivo colunas" data-ordem="local">
  {{- range slice "/paisagem" "/street" }}
  {{- with site.GetPage . }}
  <section>
    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ partial "lista-albuns.html" .Pages }}
  </section>
  {{- end }}
  {{- end }}
</div>
{{ end }}
