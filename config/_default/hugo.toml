baseURL = "https://fotografia.marcusnunes.me/"
title = "Marcus Nunes"
theme = "minimo"
copyright = "© Marcus Nunes"
defaultContentLanguage = "pt"
locale = "pt-BR"
timeZone = "America/Fortaleza"
timeout = "300s"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "rss"]
# _modelo.md são modelos para novos álbuns, não páginas
ignoreFiles = ["_modelo\\.md$"]

[params]
  # Fonte dos títulos: "garamond" (serifada) | "inter" | "instrument" | "manrope" (sem serifa)
  tipografia = "garamond"
  # Fonte do texto (corpo, menu, legendas): "hanken" | "schibsted" | "instrument" | "figtree" | "manrope" | "inter"
  tipografia_texto = "hanken"
  description = "Fotografia de Marcus Nunes — paisagem, rua e ensaios em preto e branco."
  email = "marcus.nunes@gmail.com"
  website = "https://marcusnunes.me"

# Menu principal. A página "Sobre" define o próprio item no front matter.
[menus]
  [[menus.main]]
    name = "Projetos"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Exposições"
    pageRef = "/exposicoes"
    weight = 20
  [[menus.main]]
    name = "Arquivo"
    pageRef = "/arquivo"
    weight = 30

[outputs]
  home = ["HTML"]
  section = ["HTML"]
  page = ["HTML"]

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 82
  [imaging.webp]
    quality = 82
  [imaging.exif]
    disableLatLong = true

[markup.goldmark.renderer]
  unsafe = true

# Links sociais exibidos na página Sobre (icon_pack: fas/fab/fa = Font Awesome, ai = Academicons)
